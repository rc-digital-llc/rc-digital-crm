name: release-enable

on:
  workflow_dispatch:
    inputs:
      evidence_id:
        description: Content-addressed dormant receipt ID
        required: true
        type: string
      feature:
        description: Versioned registered financial feature name
        required: true
        type: string

concurrency:
  group: production-financial-enable-${{ inputs.feature }}
  cancel-in-progress: false

permissions: {}

jobs:
  enable:
    name: independently approve one financial feature
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-financial-enable
      url: ${{ steps.publish.outputs.evidence_url }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_AUTHENTICATED_OWNER: ${{ vars.RELEASE_OWNER_LOGIN }}
      RELEASE_EVIDENCE_REPOSITORY: ${{ vars.RELEASE_EVIDENCE_REPOSITORY }}
      RELEASE_PROVIDER_TARGET: ${{ vars.RELEASE_PROVIDER_TARGET }}
      RELEASE_FEATURE: ${{ inputs.feature }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Independent protected inputs must exist
        env:
          RELEASE_EVIDENCE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
        run: |
          test -n "$RELEASE_AUTHENTICATED_OWNER"
          test -n "$RELEASE_EVIDENCE_REPOSITORY"
          test -n "$RELEASE_PROVIDER_TARGET"
          test -n "$RELEASE_EVIDENCE_TOKEN"
          test -n "$RELEASE_FEATURE"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"
      - name: Checkout release controls
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.115.0
      - name: Reject every unregistered Phase 1 feature before provider access
        run: node scripts/release/verify-financial-enable.mjs --registry "$RELEASE_FEATURE"
      - name: Fetch and verify complete dormant chain
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
        run: |
          result=$(node scripts/release/fetch-private-evidence.mjs "${{ inputs.evidence_id }}" "$RUNNER_TEMP/release-evidence" enable)
          printf '%s\n' "$result" > "$RUNNER_TEMP/release-evidence-result.json"
          node -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const key of ["commit_sha","manifest_sha256","predecessor_receipt_path","prior_receipt_path","result_path"]){process.stdout.write(`${key}=${value[key]??""}\n`)}' "$RUNNER_TEMP/release-evidence-result.json" >> "$GITHUB_OUTPUT"
      - name: Checkout exact attested commit
        run: |
          git checkout --detach "${{ steps.evidence.outputs.commit_sha }}"
          test "$(git rev-parse HEAD)" = "${{ steps.evidence.outputs.commit_sha }}"
      - name: Capture immediate provider invariants
        run: |
          mkdir -p .release
          supabase functions invoke financial-release-invariants --project-ref "$SUPABASE_PROJECT_ID" --body "{\"feature\":\"$RELEASE_FEATURE\"}" > .release/financial-invariants.json
      - name: Reverify dormant receipt and immediate enablement eligibility
        run: |
          node scripts/release/verify-receipt.mjs "${{ steps.evidence.outputs.predecessor_receipt_path }}" "${{ steps.evidence.outputs.prior_receipt_path }}"
          node scripts/release/verify-financial-enable.mjs "${{ steps.evidence.outputs.result_path }}" "$RELEASE_FEATURE" .release/financial-invariants.json
      - name: Enable only the registered provider control
        run: |
          node scripts/release/feature-transition.mjs enabled "$RELEASE_FEATURE" dormant .release/feature-request.json
          supabase functions invoke financial-feature-control --project-ref "$SUPABASE_PROJECT_ID" --body "$(tr -d '\n' < .release/feature-request.json)" > .release/provider-state.txt
          node scripts/release/verify-promotion-state.mjs "${{ steps.evidence.outputs.result_path }}" enable .release/provider-state.txt .release/post-state.json
      - name: Attest enabled manifest identity
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: release-artifacts.manifest.json
          subject-digest: sha256:${{ steps.evidence.outputs.manifest_sha256 }}
      - name: Build linked enable receipt
        id: receipt
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          node scripts/release/prepare-stage-receipt.mjs "${{ steps.evidence.outputs.predecessor_receipt_path }}" enable .release/post-state.json "$ATTESTATION_URL" .release/enable-receipt-input.json
          node scripts/release/build-receipt.mjs .release/enable-receipt-input.json .release/receipts "${{ steps.evidence.outputs.predecessor_receipt_path }}" > .release/enable-receipt-result.json
          node -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync(".release/enable-receipt-result.json","utf8"));process.stdout.write(`path=${value.path}\nreceipt_id=${value.receipt_id}\n`)' >> "$GITHUB_OUTPUT"
      - name: Publish and read back private enable receipt
        id: publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
          RELEASE_PREDECESSOR_RECEIPT: ${{ steps.evidence.outputs.predecessor_receipt_path }}
        run: |
          node scripts/release/publish-evidence.mjs "${{ steps.receipt.outputs.path }}" "${{ steps.attest.outputs.bundle-path }}" .release/financial-invariants.json .release/post-state.json | tee .release/publish-result.json
          node -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync(".release/publish-result.json","utf8"));if(value.readback!=="verified")process.exit(1);process.stdout.write(`evidence_url=${value.evidence_url}\n`)' >> "$GITHUB_OUTPUT"
