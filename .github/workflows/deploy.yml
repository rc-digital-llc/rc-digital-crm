name: non-financial-docs-demo

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**/*demo*"
      - "vite.demo.config.ts"
      - "registry.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: non-financial-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  documentation:
    name: deploy non-financial documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Configure documentation publisher identity
        run: |
          git config user.email support+actions@github.com
          git config user.name github-actions-bot
      - run: make doc-install
      - run: make registry-build
      - run: make doc-build
      - run: make registry-deploy
      - run: make doc-deploy

  demo:
    name: deploy non-financial demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.DEMO_DEPLOY_REPOSITORY != '' }}
    env:
      VITE_IS_DEMO: "true"
      VITE_INBOUND_EMAIL: ${{ vars.VITE_INBOUND_EMAIL }}
      DEMO_REMOTE: https://git:${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ vars.DEMO_DEPLOY_REPOSITORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Configure demo publisher identity
        run: |
          git config user.email support+actions@github.com
          git config user.name github-actions-bot
      - run: npm ci
      - name: Build isolated demo
        run: npm run build:demo
      - name: Publish isolated demo
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git remote add demo "$DEMO_REMOTE"
          npx --no-install gh-pages --remote demo -d dist -b "${{ vars.DEPLOY_BRANCH || 'gh-pages' }}"
